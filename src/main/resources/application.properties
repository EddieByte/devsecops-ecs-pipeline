# ──────────────────────────────────────────────────────────────────────────────
# application.properties — Spring PetClinic base configuration
#
# This is the DEFAULT profile (H2 in-memory) used by:
#   • GitHub Actions CI tests (no RDS needed — fast, isolated)
#   • Local developer runs
#
# Production (ECS) activates the "mysql" profile via the environment variable:
#   SPRING_PROFILES_ACTIVE=mysql
# which causes Spring Boot to also load application-mysql.properties,
# overriding the datasource with the real RDS connection.
# ──────────────────────────────────────────────────────────────────────────────

# ── Database profile selector ─────────────────────────────────────────────────
# Controls which db/${database}/schema.sql and data.sql are loaded at startup.
# Overridden to "mysql" in application-mysql.properties when mysql profile active.
database=h2

spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── Thymeleaf ─────────────────────────────────────────────────────────────────
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=true

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# ── Cache ─────────────────────────────────────────────────────────────────────
spring.cache.type=simple

# ── Internationalization ──────────────────────────────────────────────────────
spring.messages.basename=messages/messages

# ── Actuator — ALB health check hits /actuator/health ─────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ── Static resources ──────────────────────────────────────────────────────────
spring.web.resources.cache.cachecontrol.max-age=12h

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.org.springframework=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ── Application metadata ──────────────────────────────────────────────────────
spring.application.name=spring-petclinic
info.app.name=spring-petclinic
info.app.description=Spring PetClinic — DevSecOps ECS Pipeline Demo
info.app.version=@project.version@
