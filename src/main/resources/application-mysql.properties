# ──────────────────────────────────────────────────────────────────────────────
# application-mysql.properties — MySQL (Production) Profile
#
# Activated when: SPRING_PROFILES_ACTIVE=mysql
# This file is loaded IN ADDITION to application.properties, overriding
# the H2 defaults with the real RDS MySQL connection.
#
# Environment variables injected by the ECS Task Definition:
#
#   MYSQL_URL   — plain env var, e.g.:
#                 jdbc:mysql://your-rds-host:3306/petclinic?useSSL=true&...
#
#   MYSQL_USER  — from AWS Secrets Manager (prod/app/rds → RDS_USER key)
#   MYSQL_PASS  — from AWS Secrets Manager (prod/app/rds → RDS_PASS key)
#
# These variable names are PetClinic's native names — no application code
# changes required.
# ──────────────────────────────────────────────────────────────────────────────

# ── Switch database selector to mysql ─────────────────────────────────────────
# Causes Spring Boot to load db/mysql/schema.sql and db/mysql/data.sql
database=mysql

# ── DataSource ────────────────────────────────────────────────────────────────
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASS}

# ── SQL Initialisation ────────────────────────────────────────────────────────
# "always" — Spring Boot runs schema.sql + data.sql on every startup.
# schema.sql uses CREATE TABLE IF NOT EXISTS (idempotent).
# data.sql uses INSERT IGNORE (idempotent).
# Safe to leave as "always"; no data is lost on restart.
spring.sql.init.mode=always

# ── Actuator — restrict details in production ─────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ── Logging — reduce noise in production ──────────────────────────────────────
logging.level.org.springframework=WARN
logging.level.org.springframework.samples.petclinic=INFO
