name: DevSecOps Pipeline — ECS on EC2

# ──────────────────────────────────────────────────────────────────────────────
# Trigger strategy:
#
#   tag: v*.*.*  → Full pipeline: TEST → BUILD_AND_PUBLISH → DEPLOY
#
# Nothing runs on branch pushes or pull requests.
# To trigger the pipeline, cut a release tag:
#   git tag v1.0.0
#   git push origin v1.0.0
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*.*.*'          # Full pipeline only on release tags (e.g. v1.0.0)

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.REGISTRY }}
  IMAGE_NAME: github-actions
  ECS_CLUSTER: github-actions-app
  ECS_SERVICE: github-actions-svc
  CONTAINER_NAME: github-actions-app

permissions:
  id-token: write   # Required for OIDC token request
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Test, SAST, and Quality Gate
  # Runs on: dev branch pushes, PRs to main, and release tags
  # ──────────────────────────────────────────────
  TEST:
    name: Test & SonarCloud Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarCloud blame data

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven tests and Checkstyle
        run: mvn test checkstyle:checkstyle

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.sources=src/main/java \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.junit.reportsPath=target/surefire-reports/ \
            -Dsonar.jacoco.reportsPath=target/jacoco.exec \
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml

      - name: Check SonarCloud Quality Gate (Bugs > 35 = FAIL)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          STATUS=$(curl -s -u "${{ secrets.SONAR_TOKEN }}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${{ secrets.SONAR_PROJECT_KEY }}" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['projectStatus']['status'])")
          echo "Quality Gate Status: $STATUS"
          if [ "$STATUS" != "OK" ]; then
            echo "Quality Gate FAILED. Blocking pipeline."
            exit 1
          fi

  # ──────────────────────────────────────────────
  # JOB 2: Build Docker Image, Trivy Scan, Push to ECR
  # Runs on: release tags only (v*.*.*)
  # ──────────────────────────────────────────────
  BUILD_AND_PUBLISH:
    name: Build, Scan & Publish to ECR
    runs-on: ubuntu-latest
    needs: TEST
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        id: build-image
        run: |
          # Tag with both the git tag (e.g. v1.0.0) and the run number for traceability
          IMAGE_TAG=${{ github.ref_name }}
          docker build -t $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG $ECR_REGISTRY/$IMAGE_NAME:latest
          echo "image=$ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scan (CRITICAL gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: 'json'
          output: 'trivy-report.json'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: Upload Trivy audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ github.ref_name }}
          path: trivy-report.json

      - name: Push image to ECR (only if Trivy gate passes)
        run: |
          docker push $ECR_REGISTRY/$IMAGE_NAME:${{ github.ref_name }}
          docker push $ECR_REGISTRY/$IMAGE_NAME:latest

  # ──────────────────────────────────────────────
  # JOB 3: Deploy to ECS on EC2
  # Runs on: release tags only (v*.*.*)
  # ──────────────────────────────────────────────
  DEPLOY:
    name: Deploy to ECS (EC2 Launch Type)
    runs-on: ubuntu-latest
    needs: BUILD_AND_PUBLISH

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download live task definition from ECS
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.CONTAINER_NAME }} \
            --query taskDefinition \
            > infra/taskdeffile.json

      - name: Fill new image ID into ECS Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/taskdeffile.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Deploy ECS service with updated task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deployment summary
        run: |
          echo "Deployed image tag: ${{ github.ref_name }}"
          echo "ECS service: ${{ env.ECS_SERVICE }}"
          echo "ALB health check: /actuator/health"
          echo "Health check grace period: 30s"
