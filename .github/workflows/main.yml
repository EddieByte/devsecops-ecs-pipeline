name: DevSecOps Pipeline — ECS on EC2

# ──────────────────────────────────────────────────────────────────────────────
# Trigger: environment-scoped release tags only
#
#   dev/v1.0.0   → deploys to dev environment
#   prod/v1.0.0  → deploys to prod environment
#
# To trigger:
#   git tag dev/v1.0.0 && git push origin dev/v1.0.0
#   git tag prod/v1.0.0 && git push origin prod/v1.0.0
#
# Job execution order:
#   TEST ──► DB_MIGRATE ──► BUILD_AND_PUBLISH ──► DEPLOY
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'dev/v*.*.*'
      - 'prod/v*.*.*'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION:     ${{ secrets.AWS_REGION }}
  ECR_REGISTRY:   ${{ secrets.REGISTRY }}
  IMAGE_NAME:     github-actions
  ECS_CLUSTER:    github-actions-app
  ECS_SERVICE:    github-actions-svc
  CONTAINER_NAME: github-actions-app
  # Derives "dev" or "prod" from the tag prefix (dev/v1.0.0 → dev)
  APP_ENV:        ${{ startsWith(github.ref_name, 'prod/') && 'prod' || 'dev' }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Test, SAST, Quality Gate
  # ────────────────────────────────────────────────────────────────────────────
  TEST:
    name: Test & SonarCloud Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven tests and Checkstyle
        run: mvn test checkstyle:checkstyle

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.sources=src/main/java \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.junit.reportsPath=target/surefire-reports/ \
            -Dsonar.jacoco.reportsPath=target/jacoco.exec \
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml

      - name: Check SonarCloud Quality Gate (Bugs > 35 = FAIL)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          STATUS=$(curl -s -u "${{ secrets.SONAR_TOKEN }}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${{ secrets.SONAR_PROJECT_KEY }}" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['projectStatus']['status'])")
          echo "Quality Gate Status: $STATUS"
          if [ "$STATUS" != "OK" ]; then
            echo "Quality Gate FAILED. Blocking pipeline."
            exit 1
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Database Migration (idempotent — skips if DB already seeded)
  # Pulls all infra values from Secrets Manager written by Terraform.
  # Opens RDS SG for runner IP, runs migration, always revokes the rule.
  # ────────────────────────────────────────────────────────────────────────────
  DB_MIGRATE:
    name: Database Migration
    runs-on: ubuntu-latest
    needs: TEST

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pull infra values from Secrets Manager
        id: infra
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id ${{ env.APP_ENV }}/pipeline/infra \
            --query SecretString --output text)
          echo "rds_host=$(echo $SECRET  | python3 -c "import sys,json; print(json.load(sys.stdin)['RDS_HOST'])")"  >> $GITHUB_OUTPUT
          echo "rds_port=$(echo $SECRET  | python3 -c "import sys,json; print(json.load(sys.stdin)['RDS_PORT'])")"  >> $GITHUB_OUTPUT
          echo "rds_sg_id=$(echo $SECRET | python3 -c "import sys,json; print(json.load(sys.stdin)['RDS_SG_ID'])")" >> $GITHUB_OUTPUT

      - name: Pull DB credentials from Secrets Manager
        id: dbcreds
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id ${{ env.APP_ENV }}/app/rds \
            --query SecretString --output text)
          DB_PASS=$(echo $SECRET | python3 -c "import sys,json; print(json.load(sys.stdin)['RDS_PASS'])")
          echo "::add-mask::$DB_PASS"
          echo "db_pass=$DB_PASS" >> $GITHUB_OUTPUT

      - name: Get runner public IP
        id: runner-ip
        run: echo "ip=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

      - name: Open RDS security group for runner IP
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ steps.infra.outputs.rds_sg_id }} \
            --protocol tcp \
            --port ${{ steps.infra.outputs.rds_port }} \
            --cidr ${{ steps.runner-ip.outputs.ip }}/32
          echo "Opened 3306 for ${{ steps.runner-ip.outputs.ip }}/32"

      - name: Install MySQL client
        run: sudo apt-get install -y --no-install-recommends mysql-client

      - name: Check if DB already seeded (idempotency check)
        id: check-db
        run: |
          COUNT=$(mysql \
            -h ${{ steps.infra.outputs.rds_host }} \
            -P ${{ steps.infra.outputs.rds_port }} \
            -u admin \
            -p${{ steps.dbcreds.outputs.db_pass }} \
            --ssl-mode=REQUIRED \
            --batch --skip-column-names \
            -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='petclinic';" 2>/dev/null || echo "0")
          echo "table_count=$COUNT" >> $GITHUB_OUTPUT
          echo "Tables found in petclinic DB: $COUNT"

      - name: Run database migration
        if: steps.check-db.outputs.table_count == '0'
        run: |
          mysql \
            -h ${{ steps.infra.outputs.rds_host }} \
            -P ${{ steps.infra.outputs.rds_port }} \
            -u admin \
            -p${{ steps.dbcreds.outputs.db_pass }} \
            --ssl-mode=REQUIRED \
            < src/main/resources/db_backup.sql
          echo "Migration complete — petclinic database seeded."

      - name: Skip migration (DB already seeded)
        if: steps.check-db.outputs.table_count != '0'
        run: echo "DB already contains ${{ steps.check-db.outputs.table_count }} tables — skipping migration."

      - name: Revoke runner IP from RDS security group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ steps.infra.outputs.rds_sg_id }} \
            --protocol tcp \
            --port ${{ steps.infra.outputs.rds_port }} \
            --cidr ${{ steps.runner-ip.outputs.ip }}/32
          echo "Revoked 3306 for ${{ steps.runner-ip.outputs.ip }}/32"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Build Docker Image, Trivy Scan, Push to ECR
  # ────────────────────────────────────────────────────────────────────────────
  BUILD_AND_PUBLISH:
    name: Build, Scan & Publish to ECR
    runs-on: ubuntu-latest
    needs: DB_MIGRATE
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        id: build-image
        run: |
          # Strip the env prefix from the tag: dev/v1.0.0 → v1.0.0
          VERSION=${GITHUB_REF_NAME#*/}
          # Final image tag: dev-v1.0.0 or prod-v1.0.0
          IMAGE_TAG=${{ env.APP_ENV }}-${VERSION}
          docker build -t $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG $ECR_REGISTRY/$IMAGE_NAME:${{ env.APP_ENV }}-latest
          echo "image=$ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scan (CRITICAL gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.build-image.outputs.image_tag }}
          format: 'json'
          output: 'trivy-report.json'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: Upload Trivy audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ steps.build-image.outputs.image_tag }}
          path: trivy-report.json

      - name: Push image to ECR (only if Trivy gate passes)
        run: |
          docker push $ECR_REGISTRY/$IMAGE_NAME:${{ steps.build-image.outputs.image_tag }}
          docker push $ECR_REGISTRY/$IMAGE_NAME:${{ env.APP_ENV }}-latest

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4 — Deploy to ECS on EC2
  # ────────────────────────────────────────────────────────────────────────────
  DEPLOY:
    name: Deploy to ECS (EC2 Launch Type)
    runs-on: ubuntu-latest
    needs: BUILD_AND_PUBLISH

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download live task definition from ECS
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.CONTAINER_NAME }} \
            --query taskDefinition \
            > infra/taskdeffile.json

      - name: Fill new image ID into ECS Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/taskdeffile.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.build-image.outputs.image_tag }}

      - name: Deploy ECS service with updated task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deployment summary
        run: |
          echo "Environment: ${{ env.APP_ENV }}"
          echo "Tag:         ${{ github.ref_name }}"
          echo "Image:       ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.build-image.outputs.image_tag }}"
          echo "ECS Service: ${{ env.ECS_SERVICE }}"
          echo "Cluster:     ${{ env.ECS_CLUSTER }}"
          echo "Health check: /actuator/health"
